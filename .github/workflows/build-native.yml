name: Native Windows installer
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Check binary size
        shell: pwsh
        run: |
          $exe = Get-Item target/x86_64-pc-windows-msvc/release/hydra-installer.exe
          Write-Host "Executable size: $($exe.Length) bytes"
          if ($exe.Length -ge 10000000) { throw 'Executable exceeds 10 MB target' }
      - uses: actions/upload-artifact@v4
        with:
          name: hydra-installer-windows-x64
          path: target/x86_64-pc-windows-msvc/release/hydra-installer.exe
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hydra-installer-windows-x64
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/hydra-installer.exe
