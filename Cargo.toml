[package]
name = "hydra-installer"
version = "1.0.1"
edition = "2021"
description = "Native Windows bootstrapper for Hydra Launcher"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_Globalization", "Win32_System_Com",
  "Win32_System_LibraryLoader", "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common",
  "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi",
  "Win32_Graphics_Gdi", "Win32_Graphics_Imaging",
  "Win32_Media_MediaFoundation", "Win32_Networking_WinHttp",
  "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
  "Win32_System_Registry",
  "Foundation_Numerics"
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
